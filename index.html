    <link rel="stylesheet" href="/src/styles/style.css" />
  </head>
  <body>
    <div id="scene-mount" aria-label="Interactive 3D pachinko portfolio"></div>
    <div class="scene-vignette" aria-hidden="true"></div>
    <svg id="connector-layer" aria-hidden="true"><path id="connector-path" /><circle id="connector-origin" r="4" /></svg>
    <div id="hologram-mount"></div>
    <header class="portfolio-header" id="portfolio-header">
      <a class="identity" href="#" aria-label="Enzo's portfolio home"><span class="identity-mark" id="portfolio-initials" aria-hidden="true">F</span><span class="identity-copy"><strong id="portfolio-name">Enzo</strong><span id="portfolio-role">Developer &amp; designer</span></span></a>
      <a id="download-resume" class="resume-download header-resume" href="./assets/enzo.pdf" download hidden>Download CV<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m-4-4 4 4 4-4M5 16v4h14v-4"/></svg></a>
      <div class="header-audio" role="group" aria-label="Audio controls">
        <button type="button" id="music-toggle" class="sound-button" aria-label="Background music" aria-pressed="true" title="Mute background music"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18V5l11-2v13M9 8l11-2"/><ellipse cx="6" cy="18" rx="3" ry="2"/><ellipse cx="17" cy="16" rx="3" ry="2"/><path class="sound-muted-mark" d="m3 3 18 18"/></svg></button>
        <button type="button" id="sound-toggle" class="sound-button" aria-label="Sound effects" aria-pressed="true" title="Mute sound effects"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 4 6 8H3v8h3l5 4Z" /><g class="sound-waves"><path d="M15 8a6 6 0 0 1 0 8M18 5a10 10 0 0 1 0 14" /></g><path class="sound-muted-mark" d="m16 9 6 6m0-6-6 6" /></svg></button>
      </div>
    </header>
    <main class="game-hud" id="game-hud">
      <div class="scene-caption"><p class="eyebrow">A CAREER IN MOTION</p><h1>Every drop <br />tells a story<span>.</span></h1><p class="scene-description">Drop a ball. Follow where it lands. <br />Discover the work behind the play.</p></div>
      <div class="launch-dock">
        <div class="aim-control">
          <div class="destination-options" aria-label="Choose a destination">
            <button type="button" data-destination="about" aria-pressed="false">About</button>
            <button type="button" data-destination="experiences" aria-pressed="false">Experiences</button>
            <button type="button" data-destination="education" aria-pressed="false">Education</button>
            <button type="button" data-destination="contact" aria-pressed="false">Contact</button>
          </div>
          <input type="range" id="launch-position" min="-3.2" max="3.2" step="0.05" value="-0.8" aria-label="Select destination" />
          <div class="aim-ticks" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
        </div>
        <button type="button" id="drop-ball" class="drop-button"><span class="drop-orb" aria-hidden="true"></span><span class="drop-label">Launch ball</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20V5m-5 5 5-5 5 5" /></svg></button>
        <button type="button" id="toggle-play-mode" class="mode-button" aria-label="Enter play mode" aria-pressed="false" title="Play the ten ball challenge" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m8 5 11 7-11 7Z" /></svg><span>Play</span></button>
      </div>
      <p id="game-status" class="sr-only" role="status" aria-live="polite"></p>
    </main>
    <div id="loading-screen" class="loading-screen" role="status" aria-live="polite"><div class="loading-orbit" aria-hidden="true"><i></i><span>ED</span></div><p class="eyebrow">WELCOME TO MY WORLD</p><h4>Preparing the 3D machine…</h4></div>
    <!-- <noscript><div class="noscript-notice">This interactive portfolio needs JavaScript. Please enable it to explore the machine.</div></noscript> -->
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
